name: Publicar web (GitHub Pages)

on:
  push:
    branches: [master]
  schedule:
    - cron: "17 4 * * 1" # cada lunes, para recoger especies nuevas de PokeAPI
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write # para guardar las capturas de la prueba en la rama "capturas"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar herramientas
        run: npm install --no-save --no-audit --no-fund sharp@0.35 esbuild@0.28 playwright@1

      - name: Montar el sitio (JS empaquetado y minificado, CSS minificado)
        run: |
          mkdir -p _site/data
          cp -r web/*.html web/*.svg web/*.png web/fonts _site/
          npx esbuild web/js/inicio.js web/js/lista.js web/js/ficha.js web/js/common.js \
            --bundle --format=esm --minify --target=es2022 --outdir=_site/js
          npx esbuild web/css/site.css --minify --outfile=_site/css/site.css
          touch _site/.nojekyll

      - name: Generar datos del listado desde PokeAPI
        run: node tools/build-data.mjs _site/data/pokedex.json

      - name: Recuperar miniaturas ya generadas
        uses: actions/cache@v4
        with:
          path: .thumbs
          key: thumbs-v1-${{ hashFiles('tools/build-thumbs.mjs') }}-${{ github.run_id }}
          restore-keys: thumbs-v1-${{ hashFiles('tools/build-thumbs.mjs') }}-

      - name: Generar miniaturas WebP
        run: |
          node tools/build-thumbs.mjs _site/data/pokedex.json .thumbs
          cp -r .thumbs _site/img
          du -sh _site/img/p _site/img/hero

      - name: Probar en Chromium contra PokeAPI
        run: |
          npx playwright install --with-deps chromium
          SCREENS_DIR=screens node tools/test-web.mjs _site

      - name: Guardar capturas en la rama "capturas"
        if: always() && hashFiles('screens/*.png') != ''
        run: |
          cd screens
          git init -q
          git checkout -q -b capturas
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Capturas de ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" capturas

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
