name: Publicar web (GitHub Pages)

on:
  push:
    branches: [master]
  schedule:
    - cron: "17 4 * * 1" # cada lunes, para recoger especies nuevas de PokeAPI
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Montar el sitio
        run: |
          mkdir -p _site/css _site/data
          cp -r web/* _site/
          cp WebApplication3/Content/Site.css _site/css/site.css
          touch _site/.nojekyll

      - name: Generar datos del listado desde PokeAPI
        run: node tools/build-data.mjs _site/data/pokedex.json

      - name: Probar en Chromium contra PokeAPI
        run: |
          npm install --no-save --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
          node tools/test-web.mjs _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
